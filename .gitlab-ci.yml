stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

test-angular-app-build:
  stage: test
  image: node:16.10.0
  rules:
    - when: on_success
  before_script:
    - npm install -g @angular/cli
    - cd frontend
    - npm ci
  script:
    - node node_modules/@angular/cli/bin/ng build --configuration production
  #  artifacts:
  #    expire_in: 7 day
  #    paths:
  #      - dist/
  tags:
    - container

build-electron-app-windows:
  stage: build
  image: electronuserland/builder:wine
  rules:
    - when: on_success
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build-prod
    - npm run build-electron-only-windows
  artifacts:
    name: "$CI_COMMIT_REF_NAME-$CI_JOB_NAME"
    paths:
      - frontend/app-dist/win-unpacked
    expire_in: 1 week

build-electron-app-linux:
  stage: build
  image: electronuserland/builder
  rules:
    - when: on_success
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build-prod
    - npm run build-electron-only-linux
  artifacts:
    name: "$CI_COMMIT_REF_NAME-$CI_JOB_NAME"
    paths:
      - frontend/app-dist/linux-unpacked
    expire_in: 1 week
