stages:
  - lint
  - test
  - build-backend
  - build-frontend

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  PYINSTALLER_VERSION: "5.7"
  PYTHON_VERSION: "3.10"
  ARTIFACT_NAME_SUFFIX: $CI_COMMIT_SHA-$CI_COMMIT_TIMESTAMP
  LINUX_BACKEND_ARTIFACT_NAME: Cortado_Linux_backend_$ARTIFACT_NAME_SUFFIX
  WINDOWS_BACKEND_ARTIFACT_NAME: Cortado_Windows_backend_$ARTIFACT_NAME_SUFFIX
  LINUX_BUILD_DIR: Cortado_Linux_build_$ARTIFACT_NAME_SUFFIX
  WINDOWS_BUILD_DIR: Cortado_Windows_build_$ARTIFACT_NAME_SUFFIX

.load_project_credentials_template: &load_gitlab_credentials  # Template to load credentials for cortado-core and pm4py project
  before_script:
    - pip install pytest
    - git config --global credential.https://gitlab.fit.fraunhofer.de/cortado/cortado-core.git.username ${cortado_core_git_username}
    - git config --global credential.https://gitlab.fit.fraunhofer.de/pm4py/pm4py-core.git.username ${pm4py_core_git_username}
    
    - git config --global credential.helper store
    - git config --global credential.interactive never
    - echo https://${cortado_core_git_username}:${cortado_core_git_password}@gitlab.fit.fraunhofer.de >> /root/.git-credentials
    - echo https://${pm4py_core_git_username}:${pm4py_core_git_password}@gitlab.fit.fraunhofer.de >> /root/.git-credentials
    - pip install -r src/backend/requirements.txt

.node-critical-check: &node-critical-check
  stage: lint
  image: node
  rules:
    - when: on_success
  before_script:
    - cd src/frontend
    - npm ci

eslint-check:
  <<: *node-critical-check
  script:
    - npm run lint-scripts

html-check:
  <<: *node-critical-check
  script:
    - npm run lint-html

styles-check:
  <<: *node-critical-check
  script:
    - npm run lint-styles
  
test-angular-app-build:
  stage: test
  image: node:16.17.0
  rules:
    - when: on_success
  before_script:
    - npm install -g @angular/cli
    - cd src/frontend
    - npm ci
  script:
    - node node_modules/@angular/cli/bin/ng build --configuration production
  # artifacts:
  #   expire_in: 7 day
  #   paths:
  #     - dist/
  tags:
    - container

# build-backend-windows is coming soon 

unit_tests:
  <<: *load_gitlab_credentials
  stage: test
  image: python:$PYTHON_VERSION
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 2 weeks

backend-system-test:
  <<: *load_gitlab_credentials
  stage: test
  image: python:$PYTHON_VERSION
  script:
    - cd src/backend
    - timeout --preserve-status 60 python main.py # Start main.py and stop after 60 seconds

build-backend-linux:
  stage: build-backend
  image: python:$PYTHON_VERSION
  rules:
    - when: on_success
  before_script:
    - echo "machine gitlab.fit.fraunhofer.de login gitlab-ci-token password $CI_JOB_TOKEN" > ~/.netrc 
    - cd src/backend
    - pip install -r requirements.txt
    # - pip install graphviz==0.17
    - pip install pyinstaller==$PYINSTALLER_VERSION
  script:
    - python -O -m PyInstaller --noconfirm --clean cortado-backend.spec
    - cd ../..
    - cp -R src/backend/dist/cortado-backend .
    - cd cortado-backend
    - chmod +x cortado-backend
  artifacts:
    name: $LINUX_BACKEND_ARTIFACT_NAME
    paths:
      - cortado-backend
    expire_in: 1 week
    
build-electron-app-windows:
  stage: build-frontend
  image: electronuserland/builder:wine
  rules:
    - when: on_success
  before_script:
    - cd src/frontend
    - npm install -g npm@9.8.0
    - npm ci
    - npm install -g n
    - n latest
  script:
    - npm run build-electron-windows
    - cd ../..
    - mkdir $WINDOWS_BUILD_DIR
    - cp -R src/frontend/app-dist/win-unpacked/* $WINDOWS_BUILD_DIR
    # - cp -R cortado-backend $WINDOWS_BUILD_DIR
  artifacts:
    name: $WINDOWS_BUILD_DIR
    paths:
      - $WINDOWS_BUILD_DIR
    expire_in: 1 week

build-electron-app-linux:
  stage: build-frontend
  image: electronuserland/builder
  rules:
    - when: on_success
  before_script:
    - export LINUX_BUILD_DIR=${LINUX_BUILD_DIR//:}
    - cd src/frontend
    - npm install -g npm@9.8.0
    - npm ci
    - npm install -g n
    - n latest
  script:
    - npm run build-electron-linux
    - cd ../..
    - mkdir $LINUX_BUILD_DIR
    - cp -R src/frontend/app-dist/linux-unpacked/* $LINUX_BUILD_DIR
    - cp -R cortado-backend $LINUX_BUILD_DIR
    - chmod +x $LINUX_BUILD_DIR/cortado
    - tar c $LINUX_BUILD_DIR | xz > $LINUX_BUILD_DIR.tar.xz
  dependencies:
    - build-backend-linux
  artifacts:
    name: $LINUX_BUILD_DIR.tar.xz
    paths:
      - "*.tar.xz"
    expire_in: 1 week

.python-critical-check: &python-critical-check
  stage: lint
  image: registry.gitlab.com/gitlab-data/ci-python-image:v0.0.1
  rules:
    - when: on_success

python-black-check:
  <<: *python-critical-check
  script:
    - black --check .

