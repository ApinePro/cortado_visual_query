<div
  class="modal fade"
  id="documentationModalDialog"
  tabindex="-1"
  role="dialog"
  aria-labelledby="documentationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header h-line-modal-bottom">
        <h5 class="modal-title text-light" id="settingsModalLabel">
          Documentation
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <div class="flex-container">
          <main
            markdown
            ngPreserveWhitespaces
            [src]="'./assets/doc/user_manual.md'"
            [srcRelativeLink]="true"
            (load)="onLoad($event)"
            (error)="onError($event)"
            (ready)="onReady()"
          ></main>
          <nav *ngIf="headings">
            <ul>
              <li *ngFor="let heading of headings">
                <a
                  style="cursor: pointer"
                  fragment="{{ heading.id }}"
                  (click)="onClick(heading.id)"
                  >{{ heading.innerHTML | stripHtml }}</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </div>
      <div class="modal-footer h-line-modal-top">
        <button
          id="close-modal"
          type="button"
          class="button"
          data-bs-dismiss="modal"
        >
          <i class="bi bi-x-lg btn-icon text-danger"></i>
          Close
        </button>
      </div>
    </div>
  </div>
</div>
