<p>activity-group-input-modal works!</p>
<div
  class="modal fade show"
  id="groupNameModalDialog"
  tabindex="-1"
  role="dialog"
  aria-labelledby="groupNameModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content dialog">
      <div class="modal-header h-line-modal-bottom">
        <h5 class="modal-title text-light" id="groupNameModalLabel">
          Group Name
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <label for="maxDistance" class="input-label">Group Name: </label>
        <input
          id="groupName"
          type="text"
          class="input-field-string"
          [(ngModel)]="groupName"
          aria-describedby="nSeqHelp"
          placeholder="Group X"
        />
        <div class="modal-footer h-line-modal-top">
          <button
            id="close-modal"
            type="button"
            class="button"
            data-bs-dismiss="modal"
          >
            <i class="bi bi-x btn-icon text-danger"></i>
            Close
          </button>
          <button type="button" class="button" (click)="applyGroupName()">
            <i class="bi bi-save btn-icon text-success"></i>
            Confirm
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
