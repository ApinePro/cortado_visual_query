<div class="activity-button-area-1 bg-dark">
  <div class="container">
    <div class="row justify-content-around text-center align-items-center">
      <div class="col-3 header-first-col">Activity</div>
      <div class="col">Filter</div>
      <div class="col" style="text-align: left !important">In/Out</div>
      <div class="col-3">Activity</div>
      <div class="col">Filter</div>
      <div class="col" style="text-align: left !important">In/Out</div>
    </div>

    <div *ngFor="let index of activityNames; let i = index; let even = even">
      <div
        class="row justify-content-center text-center align-items-center"
        *ngIf="even"
      >
        <div class="col-3">
          <svg
            appVariantDrawer
            [variant]="{ variant: activityDummyVariants.get(activityNames[i]) }"
            [computeActivityColor]="computeActivityColor"
          ></svg>
        </div>
        <div class="col">
          <input
            class="form-check-input filter-checkbox"
            type="checkbox"
            (change)="activityFilterChange($event, activityNames[i])"
            [(ngModel)]="
              activityFilterStates?.get(activityNames[i])['checkbox']
            "
          />
        </div>
        <div class="col text-center">
          <div class="form-check form-switch text-center filter-toggle">
            <input
              class="form-check-input"
              type="checkbox"
              (change)="activityFilterChange($event, activityNames[i])"
              [(ngModel)]="
                activityFilterStates?.get(activityNames[i])['toggle']
              "
              [disabled]="
                activityFilterStates?.get(activityNames[i])['checkbox'] ===
                false
              "
            />
          </div>
        </div>

        <div class="col-3" *ngIf="i + 1 < activityNames.length">
          <svg
            appVariantDrawer
            [variant]="{
              variant: activityDummyVariants.get(activityNames[i + 1])
            }"
            [computeActivityColor]="computeActivityColor"
          ></svg>
        </div>
        <div class="col" *ngIf="i + 1 < activityNames.length">
          <input
            class="form-check-input filter-checkbox"
            type="checkbox"
            (change)="activityFilterChange($event, activityNames[i + 1])"
            [(ngModel)]="
              activityFilterStates?.get(activityNames[i + 1])['checkbox']
            "
          />
        </div>
        <div class="col text-center" *ngIf="i + 1 < activityNames.length">
          <div class="form-check form-switch text-center filter-toggle">
            <input
              class="form-check-input filter-toggle-input"
              type="checkbox"
              (change)="activityFilterChange($event, activityNames[i + 1])"
              [(ngModel)]="
                activityFilterStates?.get(activityNames[i + 1])['toggle']
              "
              [disabled]="
                activityFilterStates.get(activityNames[i + 1])['checkbox'] ===
                false
              "
            />
          </div>
        </div>
        <div class="col-6" *ngIf="i + 1 === activityNames.length"></div>
      </div>
    </div>
  </div>
</div>
