<div class="alert alert-dark alert-dismissible fade show variant-explorer-alert" role="alert"
     *ngIf="alertMessage">
  <i class="bi bi-exclamation-triangle text-danger"></i>&nbsp;{{alertMessage}}
  <button type="button" class="close" data-dismiss="alert" aria-label="Close" (click)="alertMessage=undefined;">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="d-flex flex-column h-100 container-variant-explorer">
  <div class="bg-dark btn-tool-bar">


    <!--<div class="btn-group align-baseline dropDownParent"
         data-toggle="tooltip" data-placement="top" data-trigger="hover"
         title="add node">
      <button class="button"
              type="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false">
        <svg class="btn-icon" fill="currentColor">
          <use xlink:href="assets/bootstrap-icons.svg#funnel"/>
        </svg>
      </button>
      <div class="dropdown-menu dropdown-node-insert">


        <div class="dropdown-item">
          <svg class="bi bi-arrow-bar-down btn-icon text-success">
            <use xlink:href="assets/bootstrap-icons.svg#check-square"/>
          </svg>
          &nbsp;fitting variants
        </div>

        <div class="dropdown-item">
          <svg class="bi bi-arrow-bar-down btn-icon text-danger">
            <use xlink:href="assets/bootstrap-icons.svg#x-square"/>
          </svg>
          &nbsp;non-fitting variants
        </div>

        <div class="dropdown-item">
          <svg class="bi bi-arrow-bar-down btn-icon">
            <use xlink:href="assets/bootstrap-icons.svg#square"/>
          </svg>
          &nbsp;all variants
        </div>

      </div>
    </div>

    <span class="vl"></span>-->

    <i class="bi bi-question-circle-fill font-large ml-1 align-middle secondary-text"
       data-toggle="tooltip" data-placement="top" data-trigger="hover" data-html="true"
       title="variants marked with <i class='bi bi-check2-circle'></i> have been explicitly added to the process
             model<hr>explicitly added variants will remain in the process tree's language when incrementally adding new
             variants">
    </i>

    <span class="vl ml-1"></span>


    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover" data-html="true"
            title='calculate conformance checking statistics
            <br><i class="bi bi-question-square text-secondary"> unknown</i>
            <br><i class="bi bi-hourglass-split text-secondary"> being calculated</i>
            <br><i class="bi bi-check-square text-success"> variant fits model</i>
            <br><i class="bi bi-x-square text-danger"> variant does not fit model</i>
            <br><i class="bi bi-check-square text-warning"></i>
            <i class="bi bi-x-square text-warning"> outdated results (model has changed)</i>'
            (click)="updateAlignments()">
      <svg class="btn-icon" fill="currentColor">
        <use xlink:href="assets/bootstrap-icons.svg#layers-fill"/>
      </svg>
      conformance check
    </button>

    <span class="vl"></span>

    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover"
            title="add selected variant(s) to current process model"
            [disabled]="selectedVariants.length===0 || !currentlyDisplayedProcessTree"
            (click)="addSelectedVariantsToModel()">
      <svg class="btn-icon" fill="currentColor"
           [ngClass]="{'text-success':!(selectedVariants.length===0 || !currentlyDisplayedProcessTree)}">
        <use xlink:href="assets/bootstrap-icons.svg#plus"/>
      </svg>
      add variant(s) to model
    </button>

    <span class="vl"></span>

    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover" data-html="true"
            title="discover an initial model from the selected variants using the standard <em>Inductive Miner</em>
            algorithm<br><b><i class='bi bi-exclamation-triangle text-warning'></i> overwrites the existing model</b>"
            [disabled]="selectedVariants.length===0"
            (click)="discover_initial_model()">
      <svg class="btn-icon" fill="currentColor" [ngClass]="{'text-success':selectedVariants.length!=0}">
        <use xlink:href="assets/bootstrap-icons.svg#diagram-2-fill"/>
      </svg>
      discover initial model
    </button>

    <span class="vl"></span>


    <button class="button" (click)="clearSelection()">
      <svg class="btn-icon text-danger" fill="currentColor">
        <use xlink:href="assets/bootstrap-icons.svg#x"/>
      </svg>
      clear selection
    </button>

    <div class="mr-3 secondary-text ml-auto">
      <em>selected variants: {{this.selectedVariants.length}}</em>
    </div>

  </div>


  <div class="main-variant-explorer flex-grow-1">
    <div class="d-flex">
      <div class="chart-variant__percentage">
        <div *ngFor="let variant of variants; let i = index" class="d-flex flex-row">

          <i class="bi bi-circle font-large mr-2 text-muted"
             *ngIf="!explicitlyAddedVariants.includes(i)"
             (click)="addExplicitlyAddedVariant(i)">
          </i>
          <i class="bi bi-check2-circle font-large mr-2 text-light cursor-pointer"
             *ngIf="explicitlyAddedVariants.includes(i)"
             (click)="removeExplicitlyAddedVariant(i)">
          </i>
          <!--<i class="bi bi-check2-circle font-large mr-2"
             [ngClass]=" explicitlyAddedVariants.includes(i)? 'text-light cursor-pointer': 'text-muted'">
          </i>-->

          <!-- hourglass-split icon-->
          <i class="bi bi-hourglass-split text-secondary font-large"
             *ngIf="variant['calculationInProgress']">
          </i>

          <!-- check-square icon-->
          <i class="bi bi-check-square font-large"
             [ngClass]="!outdatedConformanceStatistics? 'text-success' : 'text-warning'"
             *ngIf="variant.hasOwnProperty('deviation') && !variant['deviation'] &&
          !variant['calculationInProgress']"> </i>

          <!-- x-square icon-->
          <i class="bi bi-x-square font-large"
             [ngClass]="!outdatedConformanceStatistics? 'text-danger' : 'text-warning'"
             *ngIf="variant.hasOwnProperty('deviation') && variant['deviation'] && !variant['calculationInProgress']">
          </i>

          <!-- question mark icon-->
          <i class="bi bi-question-square text-secondary align-middle font-large"
             *ngIf="!variant.hasOwnProperty('deviation') && ! variant['calculationInProgress'] && !variant['calculationInProgress']">
          </i>


          <small class="ml-1 float-right cursor-help"
                 data-toggle="tooltip"
                 data-placement="right"
                 data-container="body"
                 data-html="true"
                 title="variant describes ~{{variant['percentage']}}% of all traces in the event log<br>
             <span class='text-secondary'>variant occurs {{variant['count']| number}} time(s) in total</span>">
            {{variant['percentage']}}%<br/>
            ({{variant['count'] | number}})
          </small>
        </div>
      </div>
      <div #chart id="chart"></div>
    </div>
  </div>
</div>
