<tr *ngFor="let subvariant of subvariants let ii = index">
  <td></td>
  <td>
    <table>
      <tr>
        <td>
          <div class="variant-info-cell">
            <i class="bi bi-circle font-large mr-2 text-muted"
              *ngIf="!isExplicitlyAdded(i, ii)"
              (click)="addExplicitlyAddedVariant.emit([i, ii])">
            </i>
            <i class="bi bi-check2-circle font-large mr-2 text-light cursor-pointer"
                *ngIf="isExplicitlyAdded(i, ii)"
                (click)="setExplicitlyAdded.emit([i, ii, false])">
            </i>
            <!--<i class="bi bi-check2-circle font-large mr-2"
                [ngClass]=" explicitlyAddedVariants.includes(i)? 'text-light cursor-pointer': 'text-muted'">
            </i>-->
  
            <!-- hourglass-split icon-->
            <i class="bi bi-hourglass-split text-secondary font-large"
                *ngIf="subvariant['calculationInProgress']">
            </i>
  
            <!-- check-square icon-->
            <i class="bi bi-check-square font-large"
                [ngClass]="!outdatedConformanceStatistics? 'text-success' : 'text-warning'"
                *ngIf="subvariant['deviation'] == false && subvariant['calculationInProgress'] == false"> </i>
  
            <!-- x-square icon-->
            <i class="bi bi-x-square font-large"
                [ngClass]="!outdatedConformanceStatistics? 'text-danger' : 'text-warning'"
                *ngIf="subvariant['deviation'] && subvariant['calculationInProgress'] == false">
            </i>
  
            <!-- question mark icon-->
            <i class="bi bi-question-square text-secondary align-middle font-large"
                *ngIf="subvariant['deviation'] == undefined && subvariant['calculationInProgress'] == false">
            </i>
  
  
            <small class="ml-1 float-right cursor-help"
                    data-toggle="tooltip"
                    data-placement="right"
                    data-container="body"
                    data-html="true"
                    title="variant describes ~{{subvariant['percentage']}}% of all traces in the event log<br>
                <span class='text-secondary'>variant occurs {{subvariant['count']| number}} time(s) in total</span>">
              {{subvariant['percentage']}}%<br/>
              ({{subvariant['count'] | number}})
            </small>
          </div>
        </td>
        <td style="width: 100%; padding-left: 10px;">
          <div class="variant" [ngStyle]="{ 'border-color': isSelected(i, ii) ? 'unset' : 'transparent' }">
              <app-detailled-variant [variant]="subvariant['variant']" [colorMap]="colorMap" (selectVariant)="toggleSelectSubVariant.emit([i, ii])"></app-detailled-variant>
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>
