<div class="d-flex flex-column h-100 container-variant-explorer">
  <div class="bg-dark btn-tool-bar">
    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover" data-html="true"
            title='calculate conformance checking statistics
            <br><i class="bi bi-question-square text-secondary"> unknown</i>
            <br><i class="bi bi-hourglass-split text-secondary"> being calculated</i>
            <br><i class="bi bi-check-square text-success"> variant fits model</i>
            <br><i class="bi bi-x-square text-danger"> variant does not fit model</i>
            <br><i class="bi bi-check-square text-warning"></i>
            <i class="bi bi-x-square text-warning"> outdated results (model has changed)</i>'
            (click)="updateAlignments()">
      <svg class="btn-icon" fill="currentColor">
        <use xlink:href="assets/bootstrap-icons.svg#layers-fill"/>
      </svg>
      conformance check
    </button>

    <span class="vl"></span>

    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover"
            title="add selected variants to model"
            [disabled]="selectedVariants.length===0">
      <svg class="btn-icon" fill="currentColor" [ngClass]="{'text-success':selectedVariants.length!=0}">
        <use xlink:href="assets/bootstrap-icons.svg#plus"/>
      </svg>
      add variants to model
    </button>

    <span class="vl"></span>

    <button class="button"
            data-toggle="tooltip" data-placement="top" data-trigger="hover" data-html="true"
            title="discover an initial model from the selected variants using the standard <em>Inductive Miner</em>
            algorithm<br><b><i class='bi bi-exclamation-triangle text-warning'></i> overwrites the existing model</b>"
            [disabled]="selectedVariants.length===0"
            (click)="discover_initial_model()">
      <svg class="btn-icon" fill="currentColor" [ngClass]="{'text-success':selectedVariants.length!=0}">
        <use xlink:href="assets/bootstrap-icons.svg#diagram-2-fill"/>
      </svg>
      discover initial model
    </button>

    <span class="vl"></span>


    <button class="button" (click)="clearSelection()">
      <svg class="btn-icon text-danger" fill="currentColor">
        <use xlink:href="assets/bootstrap-icons.svg#x"/>
      </svg>
      clear selection
    </button>

    <div class="mr-3 secondary-text ml-auto">
      <em>selected variants: {{this.selectedVariants.length}}</em>
    </div>

  </div>


  <div class="main-variant-explorer flex-grow-1">
    <div class="d-flex">
      <div class="chart-variant__percentage">
        <div *ngFor="let variant of variants" class="d-flex flex-row">


          <!-- hourglass-split icon-->
          <i class="bi bi-hourglass-split text-secondary"
             *ngIf="variant['calculationInProgress']">
          </i>

          <!-- check-square icon-->
          <i class="bi bi-check-square"
             [ngClass]="usedTreeForConformanceChecking==currentlyDisplayedProcessTree? 'text-success' : 'text-warning'"
             *ngIf="variant.hasOwnProperty('deviation') && !variant['deviation'] && !variant['calculationInProgress']"> </i>

          <!-- x-square icon-->
          <i class="bi bi-x-square"
             [ngClass]="usedTreeForConformanceChecking==currentlyDisplayedProcessTree? 'text-danger' : 'text-warning'"
             *ngIf="variant.hasOwnProperty('deviation') && variant['deviation'] && !variant['calculationInProgress']">
          </i>

          <!-- question mark icon-->
          <i class="bi bi-question-square text-secondary align-middle"
             *ngIf="!variant.hasOwnProperty('deviation') && ! variant['calculationInProgress'] && !variant['calculationInProgress']">
          </i>


          <small class="ml-1 float-right cursor-help"
                 data-toggle="tooltip"
                 data-placement="right"
                 data-container="body"
                 data-html="true"
                 title="variant describes ~{{variant['percentage']}}% of all traces in the event log<br>
             <span class='text-secondary'>variant occurs {{variant['count']| number}} time(s) in total</span>">
            {{variant['percentage']}}%<br/>
            ({{variant['count'] | number}})
          </small>
        </div>
      </div>
      <div #chart id="chart"></div>
    </div>
  </div>
</div>
