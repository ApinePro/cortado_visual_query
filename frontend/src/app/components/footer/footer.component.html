<footer class="footer">
  <div class="clearfix pe-1 ps-1">
    <ng-container *ngIf="currentTask">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
      </div>
      <span class="sr-only ps-1">Loading...</span>

      <span class="font-weight-light">
      ( {{currentTask|lowercase}} )
      </span>
        <span class="font-weight-light" *ngIf="numberTasks>1">
        (remaining tasks: {{numberTasks|number}})
      </span>
    </ng-container>

    <span class="float-end text-secondary">
      <a href="mailto:cortado@fit.fraunhofer.de"><i class="bi bi-question-circle"></i> contact</a>

      <span class="vl ms-2 me-2"></span>
      <a href="https://cortado.fit.fraunhofer.de/#download" target="_blank" data-bs-toggle="tooltip" data-placement="top"
         title="Check for updates">version {{version}}</a>

      <span class="vl ms-2 me-2"></span>
      powered by
       <img src="assets/pm4py-logo.svg" height="20">
    </span>
  </div>
</footer>
