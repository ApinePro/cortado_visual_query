<app-drop-zone
  [dropzoneConfig]="dropZoneConfig"
  (fileOnHover)="toggleBlur($event)"
>
</app-drop-zone>

<div
  class="variant-miner-mainblock h-100 d-flex flex-column"
  [class.blurOutOfFocus]="variantMinerOutOfFocus"
>
  <div class="bg-dark btn-tool-bar">
    <button
        class="button"
        (click)="startMining()"
        type="button"
      >
        <i class="bi bi-minecart-loaded btn-icon"></i>
      </button>

  </div>



</div>
