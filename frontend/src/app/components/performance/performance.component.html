<ul class="nav nav-tabs bg-dark" id="myTab" role="tablist">
  <li class="nav-item" role="presentation">
    <button
      class="nav-link active button"
      id="selection-tab"
      data-bs-toggle="tab"
      data-bs-target="#selection"
      role="tab"
      aria-controls="selection"
      aria-selected="true"
    >
      Selection
    </button>
  </li>
  <!-- <li class="nav-item" role="presentation">
    <button class="nav-link button" id="nodes-tab" data-bs-toggle="tab" data-bs-target="#nodes" type="button" role="tab"
      aria-controls="nodes" aria-selected="false">All Nodes</button>
  </li> -->
  <li class="nav-item" role="presentation">
    <button
      class="nav-link button"
      id="colormap-tab"
      data-bs-toggle="tab"
      data-bs-target="#colormap"
      type="button"
      role="tab"
      aria-controls="colormap"
      aria-selected="false"
    >
      Color Map
    </button>
  </li>
</ul>
<div class="tab-content" id="myTabContent">
  <div
    class="tab-pane fade show active"
    id="selection"
    role="tabpanel"
    aria-labelledby="selection-tab"
  >
    <div
      *ngIf="performanceService.treeSelection"
      style="overflow: auto; display: flex; flex-direction: column"
    >
      <app-tree-string-renderer
        [styled_tree_string]="treeSelection"
      ></app-tree-string-renderer>
      <div class="tree-selection-body">
        <app-node-selection-performance></app-node-selection-performance>
      </div>
    </div>
  </div>
  <div
    class="tab-pane fade"
    id="nodes"
    role="tabpanel"
    aria-labelledby="nodes-tab"
  >
    <div class="" id="accordion">
      <div
        class="accordion-item"
        *ngFor="let p of performanceValues; let i = index"
      >
        <h2 class="accordion-header" [id]="'accordionHeader' + i">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            [attr.data-bs-target]="'#accordion' + i"
            aria-expanded="false"
            [aria-controls]="'accordion' + i"
          >
            {{ p[0] }}
          </button>
        </h2>
        <div
          [id]="'accordion' + i"
          class="accordion-collapse collapse"
          [aria-labelledby]="'accordionHeader' + i"
        >
          <div class="accordion-body">
            <table
              class="table table-striped table-dark table-hover table-bordered"
            >
              <tbody>
                <tr>
                  <td>Mean:</td>
                  <td>{{ p[1].mean | humanizeDuration }}</td>
                </tr>
                <tr>
                  <td>Stdev:</td>
                  <td>{{ p[1].stdev | humanizeDuration }}</td>
                </tr>
                <tr>
                  <td>Min:</td>
                  <td>{{ p[1].min | humanizeDuration }}</td>
                </tr>
                <tr>
                  <td>Max:</td>
                  <td>{{ p[1].max | humanizeDuration }}</td>
                </tr>
                <tr>
                  <td>95th Percentile:</td>
                  <td>{{ p[1]["95th"] | humanizeDuration }}</td>
                </tr>
                <tr>
                  <td>50th Percentile:</td>
                  <td>{{ p[1]["50th"] | humanizeDuration }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div
    class="tab-pane fade color-map-tab"
    id="colormap"
    role="tabpanel"
    aria-labelledby="nodes-tab"
  >
    <app-tree-performance-color-map></app-tree-performance-color-map>
  </div>
</div>
