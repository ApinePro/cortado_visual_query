<td
  class="infix-selection-buttons-panel"
  *ngIf="traceInfixSelectionMode && !performanceMode"
>
  <div>
    <td>
      <button
        [disabled]="!isAnyInfixSelected"
        class="button"
        (click)="resetSelectionStatus()"
        title="Reset trace infix selection of this variant"
        data-bs-toggle="tooltip"
      >
        <i
          class="bi bi-x-lg align-middle font-large"
          [ngClass]="isAnyInfixSelected ? 'text-danger' : 'text-secondary'"
        ></i>
      </button>
    </td>
    <td>
      <button
        [disabled]="!isAnyInfixSelected"
        class="button"
        (click)="addCurrentSelectedInfix()"
        title="Add the currently selected infix to the variant explorer"
        data-bs-toggle="tooltip"
      >
        <i
          class="bi bi-scissors align-middle font-large"
          [ngClass]="isAnyInfixSelected ? 'text-light' : 'text-secondary'"
        ></i>
      </button>
    </td>
  </div>
</td>
