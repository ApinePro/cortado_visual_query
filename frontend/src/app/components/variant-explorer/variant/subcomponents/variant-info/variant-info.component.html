<div class="variant-info-cell">
  <app-variant-selection-button
    *ngIf="selectable"
    [isSelected]="variant.isSelected"
    (selectionChanged)="selectionChanged.emit($event)"
  >
  </app-variant-selection-button>

  <div
    (click)="conformanceIconClicked()"
    [ngClass]="isConformanceUpdatePossible() ? 'cursor-pointer' : ''"
    *ngIf="processTreeIsPresent"
  >
    <app-conformance-status-icon
      [variant]="variant"
    ></app-conformance-status-icon>
  </div>

  <small
    *ngIf="!variant.userDefined"
    class="ms-1 float-end cursor-help"
    data-bs-toggle="tooltip"
    data-bs-placement="right"
    data-bs-container="body"
    data-bs-html="true"
    title="variant describes ~{{
      variant.percentage
    }}% of all traces in the event log<br>
  <span class='text-secondary'>variant occurs {{
      variant.count | number
    }} time(s) in total</span>"
  >
    {{ variant.percentage }}%<br />
    ({{ variant.count | number }})
  </small>

  <small
    *ngIf="variant.userDefined"
    class="ms-1 float-end cursor-help"
    data-bs-toggle="tooltip"
    data-bs-placement="right"
    data-bs-container="body"
    data-bs-html="true"
    title="User created Variant"
  >
    <i class="bi bi-person-circle fs-5 ms-2"></i>
  </small>
  <small
    *ngIf="variant.userDefined && variant.infixType !== 4"
    class="ms-1 float-end cursor-help"
    data-bs-toggle="tooltip"
    data-bs-placement="right"
    data-bs-container="body"
    data-bs-html="true"
    title="#Variants that contain the fragment at least once:  {{
      variant.fragmentStatistics?.variantOccurrences ?? '-'
    }} <br> #Occurrences in variants: {{
      variant.fragmentStatistics?.totalOccurrences ?? '-'
    }} <br> #Traces that contain the fragment: {{
      variant.fragmentStatistics?.traceOccurrences ?? '-'
    }}"
  >
    <i class="bi bi-info fs-5 ms-2"></i>
  </small>
</div>
