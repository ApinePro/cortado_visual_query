<div
  class="context-menu"
  [style.top.px]="yPos"
  [style.left.px]="xPos"
  *ngIf="displayMenu"
>
  <ul class="context-menu-list">
    <li *ngFor="let option of contextMenuOptions | keyvalue">
      <button class="button align-bottom" (click)="option.value()">
        <div>
          <i class="bi bi-diagram-2 btn-icon"></i>
          <span>{{ option.key }}</span>
        </div>
      </button>
    </li>
  </ul>
</div>
