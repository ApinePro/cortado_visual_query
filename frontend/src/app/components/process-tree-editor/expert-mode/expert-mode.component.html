<div class="accordion accordion-flush" id="ExpertModeAccordion" class = "expertModeAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header" id="ExpertModeHeading">
      <button #expertModeButton
        class="accordion-button"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#ExpertModeBody"
        (click) = "openExpertMode()"
      >
        Expert Mode
      </button>
    </h2>
    <div
      id="ExpertModeBody"
      class="accordion-collapse collapse"
      data-bs-parent="#ExpertModeAccordion"
    >
      <div class="accordion-body">
        <form [formGroup]="syntaxTreeInput" (ngSubmit)="onSubmit()" (blur)="styleText()">
          <div class="editor-container" [hidden]="!edit">
            <span class = "secondary-text fw-bold mb-1">Editing Tree String</span>
            <textarea class="editor" (blur)="styleText()"  #textEditor [formControl]="syntax_tree" spellcheck="false"> </textarea>
          </div>

          <div [hidden]="edit || !currentlyDisplayedTreeInExpertMode">
            <span class = "secondary-text fw-bold mb-1">Tree String</span>
            <div #styledText class="styled-text-field" (dblclick)="openEditor()"></div>
          </div>

          <ul *ngIf="syntax_tree.invalid && (syntax_tree.dirty || syntax_tree.touched)"
            class="syntax-error">

            <div *ngIf="syntax_tree.errors?.['unknowActivities']">
              <li *ngFor="let unknownActivity of syntax_tree.errors?.['unknowActivities']">
              Unknown activity name {{unknownActivity.name}} at: {{unknownActivity.index}}
              </li>
            </div>
            <div *ngIf="syntax_tree.errors?.['imbalanced']">
              <li *ngFor="let imbalancedItem of syntax_tree.errors?.['imbalanced']">
                Imbalanced {{imbalancedItem.symbol}} at {{imbalancedItem.index + 1}}
              </li>
            </div>
            <li *ngIf="syntax_tree.errors?.['apostrophe']">
                Imbalanced Apostrophes
            </li>

            <li *ngIf="backendErrors">
              {{backendErrors}}
            </li>

          </ul>


        <div class="expert-mode-tool-bar mt-3">
          <button type="submit" class="button" *ngIf="currentlyDisplayedTreeInExpertMode"
          [disabled]="!allowRender || syntax_tree.invalid">Render Tree</button>
        </div>
      </form>
  </div>
</div>
